<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<script src="config.js"></script>
<title>Notas de catequesis PAC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
  /* Layout: app móvil de una columna. Cabecera mínima, contenido a 40 rem como máximo y barra inferior fija con 4 secciones. Cada sesión se lee en capas: idea central, claves y notas completas al final. */
  :root {
    --bg: #F0F3F1;
    --surface: #FAFBFA;
    --ink: #16221E;
    --muted: #56655F;
    --line: #D3DCD8;
    --accent: #1E5E4E;
    --accent-soft: #DCEBE5;
    --on-accent: #FFFFFF;
    --gold-ink: #7A5A10;
    --gold-soft: #F3EACB;
    --mark: #F5E39B;
    --danger: #9B2C2C;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1614; --surface: #151F1C; --ink: #E4EDE9; --muted: #9BADA6; --line: #2A3A35;
      --accent: #7CCBB1; --accent-soft: #1B332C; --on-accent: #0C1B16;
      --gold-ink: #E2BE6A; --gold-soft: #2B2513; --mark: #5E4E12; --danger: #F0A0A0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1614; --surface: #151F1C; --ink: #E4EDE9; --muted: #9BADA6; --line: #2A3A35;
    --accent: #7CCBB1; --accent-soft: #1B332C; --on-accent: #0C1B16;
    --gold-ink: #E2BE6A; --gold-soft: #2B2513; --mark: #5E4E12; --danger: #F0A0A0;
    color-scheme: dark;
  }

  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  button, input, textarea { font: inherit; color: inherit; }
  input, textarea { box-sizing: border-box; max-width: 100%; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 .08em; }
  a { color: var(--accent); }

  .app { max-width: 40rem; margin-inline: auto; padding-inline: 1rem; padding-block: 0 6rem; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding-block: .9rem .5rem; }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 1.2rem; line-height: 1.15; }
  .brand small { display: block; font-family: var(--sans); font-size: .66rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

  .btn {
    padding: .5rem .85rem; font-size: .88rem; font-weight: 500; line-height: 1.2;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.1); color: var(--on-accent); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.danger { color: var(--danger); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .lab { display: block; margin-bottom: .25rem; font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .muted { color: var(--muted); }
  h2.sec { margin: 1.6rem 0 .5rem; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* Barra inferior */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bar-in { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 40rem; margin-inline: auto; }
  .bar button { display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .55rem .25rem .5rem; font-size: .7rem; font-weight: 600; color: var(--muted); background: none; border: 0; }
  .bar button svg { width: 1.4rem; height: 1.4rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bar button[aria-current="page"] { color: var(--accent); }

  /* Inicio */
  .hero { padding: 1.1rem 1rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .hero .meta { font-size: .75rem; color: var(--muted); }
  .hero h1 { margin: .15rem 0 .6rem; font-family: var(--serif); font-size: 1.5rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
  .idea { margin: 0 0 .75rem; padding: .75rem .85rem; background: var(--accent-soft); border-radius: 6px; }
  .idea p { margin: 0; font-family: var(--serif); font-size: 1.08rem; line-height: 1.4; font-weight: 600; }
  .claves { margin: 0 0 .85rem; padding-left: 1.1rem; font-family: var(--serif); font-size: 1rem; }
  .claves li { margin-bottom: .35rem; padding-left: .15rem; }
  .claves li::marker { color: var(--accent); }
  .acts { display: flex; flex-wrap: wrap; gap: .5rem; }
  .qcard { padding: .9rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .qcard .q { margin: 0 0 .6rem; font-family: var(--serif); font-size: 1.1rem; font-weight: 600; line-height: 1.35; }
  .qcard .a { margin: 0 0 .6rem; padding-top: .6rem; border-top: 1px solid var(--line); font-family: var(--serif); }
  .prog { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .35rem 1rem; align-items: center; margin-top: 1.1rem; font-size: .85rem; color: var(--muted); }
  .bar2 { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar2 i { display: block; height: 100%; background: var(--accent); }

  /* Lista de sesiones */
  .sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; padding-block: .5rem; background: var(--bg); }
  .sbar input, .field input, .field textarea {
    width: 100%; padding: .65rem .8rem; font-size: 1rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
  }
  .sbar input::placeholder, .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
  .chips { display: flex; gap: .4rem; margin-top: .5rem; overflow-x: auto; scrollbar-width: none; padding-bottom: .1rem; }
  .chips::-webkit-scrollbar { display: none; }
  .fchip { flex: none; padding: .3rem .8rem; font-size: .82rem; font-weight: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; color: var(--ink); }
  .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .count { margin: .5rem 0 0; font-size: .78rem; color: var(--muted); }
  .yr { margin: 1.1rem 0 0; padding-bottom: .25rem; font-size: .75rem; font-weight: 600; letter-spacing: .12em; color: var(--muted); border-bottom: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
  .row {
    display: grid; grid-template-columns: 3.3rem minmax(0, 1fr) auto; gap: .65rem; width: 100%; padding: .75rem .1rem;
    text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: inherit;
  }
  .row:hover .t { color: var(--accent); }
  .row .d { padding-top: .15rem; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); line-height: 1.25; }
  .row .d b { display: block; font-size: .95rem; letter-spacing: 0; color: var(--accent); }
  .row .t { display: block; font-family: var(--serif); font-size: 1.04rem; line-height: 1.3; font-weight: 600; }
  .row .s { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: .15rem; font-size: .85rem; line-height: 1.4; color: var(--muted); }
  .row .r { display: flex; flex-direction: column; align-items: flex-end; gap: .25rem; padding-top: .2rem; font-size: .72rem; color: var(--muted); }
  .tick { color: var(--accent); font-weight: 700; }
  .cc { padding: 0 .45rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px; font-weight: 600; }
  .new { padding: 0 .4rem; background: var(--gold-soft); color: var(--gold-ink); border-radius: 3px; font-size: .62rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-left: .4rem; vertical-align: .1em; }
  .gaprow { display: grid; grid-template-columns: 3.3rem minmax(0, 1fr); gap: .65rem; padding: .7rem .1rem; border-bottom: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
  .gaprow b { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .empty { margin: 1.5rem 0; padding: 1.1rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }

  .cal { margin-top: 1.4rem; }
  .cal > summary { padding: .5rem 0; font-size: .85rem; font-weight: 600; color: var(--accent); cursor: pointer; }
  .grid { display: grid; grid-template-columns: 2.2rem repeat(12, minmax(0, 1fr)); gap: 2px; align-items: center; }
  .grid .y { font-size: .72rem; font-weight: 600; color: var(--muted); }
  .grid .mh { text-align: center; font-size: .62rem; font-weight: 600; color: var(--muted); }
  .cell { display: block; width: 100%; height: 1.4rem; padding: 0; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); }
  .cell.ok { background: var(--accent); border-color: var(--accent); }
  .cell.sin { background: transparent; border: 1.5px dashed var(--accent); }
  .cell.no { background: repeating-linear-gradient(135deg, var(--line) 0 3px, transparent 3px 7px); }
  .legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; margin-top: .6rem; font-size: .72rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i { display: inline-block; width: .85rem; height: .85rem; border-radius: 3px; }

  /* Detalle de sesión */
  .dbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding-block: .55rem; background: var(--bg); border-bottom: 1px solid var(--line); }
  .dbar .pg { display: flex; gap: .35rem; }
  .sess { padding-top: 1rem; }
  .sess .meta { font-size: .78rem; color: var(--muted); }
  .sess h1 { margin: .15rem 0 .2rem; font-family: var(--serif); font-size: 1.55rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
  .sess .sub { margin: 0 0 .8rem; font-size: .9rem; color: var(--muted); }
  .pensar { margin: 1rem 0; padding: .75rem .9rem; border: 1px dashed var(--accent); border-radius: 6px; }
  .pensar p { margin: 0; font-family: var(--serif); font-style: italic; }
  .terms { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: .9rem 0; }
  .chip { padding: .25rem .75rem; font-size: .84rem; font-weight: 500; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; }
  .chip:hover { background: var(--accent); color: var(--on-accent); }
  .chip.s { color: var(--ink); background: transparent; border: 1px solid var(--line); padding: .15rem .6rem; font-size: .78rem; }
  .chip.s:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip.pick[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .notes { margin: 1rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .notes > summary { padding: .7rem 0; font-size: .9rem; font-weight: 600; color: var(--accent); cursor: pointer; }
  .notes-body { padding-bottom: 1rem; font-family: var(--serif); font-size: 1.02rem; line-height: 1.6; }
  .notes-body p { margin: 0 0 .8rem; }
  .notes-body ul, .notes-body ol { margin: 0 0 .9rem; padding-left: 1.15rem; }
  .notes-body li { margin-bottom: .5rem; padding-left: .15rem; }
  .notes-body li::marker { color: var(--accent); }
  .notes-body ol ul { margin: .4rem 0 0; }
  .notes-body h4 { margin: 1.2rem 0 .5rem; font-family: var(--sans); font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .notes-body dl { display: grid; gap: .7rem; margin: 0 0 .9rem; }
  .notes-body dt { font-family: var(--sans); font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .notes-body dd { margin: .1rem 0 0; }
  .call { margin: 1rem 0; padding: .75rem .9rem; background: var(--gold-soft); border-radius: 4px; }
  .call b { display: block; margin-bottom: .2rem; font-family: var(--sans); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-ink); }
  .call p, .call ol { margin: 0; }
  .call ol { list-style: upper-alpha; padding-left: 1.3rem; }
  blockquote { margin: 1.1rem 0 .4rem; padding-top: .7rem; border-top: 1px solid var(--accent); }
  blockquote p { margin: 0; font-style: italic; font-size: 1.06rem; }
  blockquote cite { display: block; margin-top: .3rem; font-family: var(--sans); font-size: .72rem; font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin: .8rem 0; font-family: var(--sans); }
  .tags .tl { flex-basis: 100%; font-size: .78rem; color: var(--muted); }
  .tags .tg { padding: .2rem .7rem; font-size: .84rem; color: var(--accent); background: var(--accent-soft); border-radius: 999px; }
  .links { list-style: none; padding-left: 0 !important; font-family: var(--sans); }
  .links li { padding-left: 0; }
  .links .u { margin-left: .5rem; font-size: .78rem; color: var(--muted); }
  .nextrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; margin-top: 1.2rem; }
  .nextrow button { padding: .6rem .75rem; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: .78rem; color: var(--muted); }
  .nextrow button b { display: block; font-family: var(--serif); font-size: .92rem; color: var(--ink); line-height: 1.25; }
  .nextrow button:last-child { text-align: right; }

  /* Comentarios */
  .cm { margin-top: 1.4rem; }
  .cm h3 { margin: 0 0 .5rem; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .cm-item { padding: .65rem 0; border-top: 1px solid var(--line); }
  .cm-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .6rem; font-size: .8rem; color: var(--muted); }
  .cm-h b { color: var(--ink); font-weight: 600; }
  .cm-h .x { margin-left: auto; padding: 0 .25rem; font-size: .78rem; background: none; border: 0; color: var(--muted); text-decoration: underline; }
  .cm-t { margin: .15rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cm-form { margin-top: .6rem; display: grid; gap: .5rem; }
  .cm-form textarea { width: 100%; padding: .6rem .8rem; font-size: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .cm-note { margin: .5rem 0 0; padding: .65rem .8rem; font-size: .85rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; }

  /* Conceptos */
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps > li { counter-increment: s; border-bottom: 1px solid var(--line); }
  .steps summary, .tl summary { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); gap: .5rem; align-items: baseline; padding: .7rem 0; cursor: pointer; list-style: none; }
  .tl summary { grid-template-columns: minmax(0, 1fr); }
  .steps summary::-webkit-details-marker, .tl summary::-webkit-details-marker { display: none; }
  .steps summary::before { content: counter(s); display: grid; place-items: center; width: 1.5rem; height: 1.5rem; font-size: .78rem; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 50%; }
  .steps summary b, .tl summary b { font-family: var(--serif); font-size: 1.04rem; font-weight: 600; }
  .steps summary small { display: block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .steps .in, .tl .in { padding: 0 0 .9rem 2.3rem; font-family: var(--serif); }
  .tl .in { padding-left: 0; }
  .steps .in p, .tl .in p { margin: 0 0 .6rem; }
  .tl { border-bottom: 1px solid var(--line); }
  .chips2 { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; font-family: var(--sans); font-size: .76rem; color: var(--muted); margin-bottom: .3rem; }
  .field { display: grid; gap: .25rem; margin-bottom: .7rem; font-size: .85rem; font-weight: 600; }
  .field textarea { resize: vertical; font-weight: 400; }
  .field input { font-weight: 400; }

  /* Repasar */
  .deckbar { display: flex; justify-content: space-between; gap: 1rem; font-size: .82rem; color: var(--muted); }
  .card { display: flex; flex-direction: column; gap: .8rem; min-height: 14rem; margin-top: .7rem; padding: 1.2rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .card .q { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; line-height: 1.3; text-wrap: balance; }
  .card .a { padding-top: .8rem; border-top: 1px solid var(--line); font-family: var(--serif); font-size: 1.08rem; }
  .card .src { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; font-size: .78rem; color: var(--muted); }
  .card .acts { margin-top: auto; }
  .subnav { display: flex; justify-content: space-between; margin-top: .5rem; }
  .ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .9rem; margin-top: .9rem; font-size: .85rem; }
  .ctrls label { display: inline-flex; align-items: center; gap: .4rem; }

  /* Hoja inferior y avisos */
  .sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(8, 14, 12, .55); }
  .sheet-card { position: relative; width: 100%; max-width: 40rem; max-height: 88%; overflow-y: auto; padding: 1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-radius: 14px 14px 0 0; border: 1px solid var(--line); }
  .sheet-card h2 { margin: 0 0 .5rem; font-family: var(--serif); font-size: 1.3rem; line-height: 1.25; }
  .sheet-card p { margin: 0 0 .8rem; font-family: var(--serif); }
  .sheet-card .hint { font-family: var(--sans); font-size: .8rem; color: var(--muted); }
  .sheet-card textarea.copy { width: 100%; min-height: 9rem; padding: .6rem; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: calc(100% - 2rem); padding: .55rem .9rem; font-size: .85rem; color: var(--on-accent); background: var(--accent); border-radius: 8px; transform: translateX(-50%); }
  .foot { margin-top: 2rem; font-size: .75rem; color: var(--muted); }

  @media (max-width: 380px) {
    .hero h1, .sess h1 { font-size: 1.35rem; }
    .grid { grid-template-columns: 2rem repeat(12, minmax(0, 1fr)); }
  }

  /* Calendario, notas personales, borradores */
  .calbox { margin: .9rem 0 0; padding: .7rem .75rem .8rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .calbox h3 { margin: 0 0 .5rem; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  button.cell { cursor: pointer; }
  button.cell:hover { filter: brightness(1.15); }
  .cell.multi { display: grid; place-items: center; font-size: .68rem; font-weight: 700; color: var(--on-accent); line-height: 1; }
  .cell.now { outline: 2px solid var(--ink); outline-offset: 1px; }
  .yr { display: flex; justify-content: space-between; align-items: center; }
  .yr .btn { padding: .25rem .5rem; font-size: .75rem; font-weight: 500; letter-spacing: 0; }
  .dot { width: .5rem; height: .5rem; background: var(--gold-ink); border-radius: 50%; }
  .hint { margin: .3rem 0 .6rem; font-size: .8rem; color: var(--muted); }
  .mine { margin-top: 1.4rem; padding-top: .9rem; border-top: 1px solid var(--line); }
  .mine h3 { margin: 0 0 .6rem; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .check { display: flex; align-items: center; gap: .5rem; margin: -.2rem 0 .8rem; font-size: .9rem; }
  .dr { display: grid; gap: .4rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
  .linkbtn { padding: 0; font: inherit; color: var(--accent); background: none; border: 0; text-decoration: underline; }

/* v7: jerarquía y cabecera fija */

  /* Sesiones añadidas después de la primera versión. Cada una: id, date (AAAA-MM-DD), title, idea, claves[], pensar, terms[], text (las notas), added (fecha en que se añadió). */
  const NEW = [

  const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const AB = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const INI = ['E','F','M','A','M','J','J','A','S','O','N','D'];
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const reviewed = new Set(LS.get('pac.reviewed', []));
  const known = new Set(LS.get('pac.known', []));
  let my = LS.get('pac.my', {});
  let sheetSess = LS.get('pac.cache', []);
  const saveMy = () => LS.set('pac.my', my);

  function fold(s) {
    let out = '';
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      let f = c.normalize('NFD')[0] || c;
      f = f.toLowerCase();
      out += f.length === 1 ? f : c;
    }
    return out;
  }
  function hl(t, q) {
    if (!q) return esc(t);
    const ft = fold(t), fq = fold(q);
    let out = '', pos = 0, i;
    while (fq && (i = ft.indexOf(fq, pos)) !== -1) {
      out += esc(t.slice(pos, i)) + '<mark>' + esc(t.slice(i, i + fq.length)) + '</mark>';
      pos = i + fq.length;
    }
    return out + esc(t.slice(pos));
  }
  const words = (s) => (String(s).match(/\S+/g) || []).length;
  function flat(b) {
    switch (b[0]) {
      case 'p': case 'li': case 'h': return b[1];
      case 'ol': return b[1].map((x) => Array.isArray(x) ? x[0] + ' ' + x[1].join(' ') : x).join(' ');
      case 'call': return b[1] + ' ' + (Array.isArray(b[2]) ? b[2].join(' ') : b[2]);
      case 'q': return b[1] + ' ' + (b[2] || '');
      case 'dl': return b[1].map((x) => x[0] + ' ' + x[1]).join(' ');
      case 'tags': return b[1] + ' ' + b[2].join(' ');
      case 'links': return b[1].map((x) => x[0]).join(' ');
    }
    return '';
  }
  function textToBlocks(t) {
    const out = [];
    String(t || '').split(/\r?\n/).forEach((raw) => {
      const line = raw.trim();
      if (!line) return;
      const m = line.match(/^([.\-•*]|\d+[.)])\s+(.*)$/) || line.match(/^([.\-•*])(\S.*)$/);
      if (m) out.push(['li', m[2]]); else out.push(['p', line]);
    });
    return out;
  }

  /* ---------- Estado ---------- */
  const glossById = {};
  GLOSS.forEach((g) => { glossById[g.id] = g; });
  const S = { tab: 'inicio', sid: null, q: '', filter: 'todas', month: null, from: 'inicio', scroll: {}, cq: '', confirm: null };
  let items = [], byId = {}, real = [];

  function parts(date) { const p = date.split('-'); return { y: +p[0], m: +p[1] - 1 }; }
  function dateLabel(e) { const p = parts(e.date); return (e.day ? +e.day + ' ' : '') + AB[p.m] + ' ' + p.y; }
  function lead(e) {
    if (e.idea) return e.idea;
    const b = (e.blocks || []).find((x) => x[0] === 'p' || x[0] === 'li' || x[0] === 'q');
    return b ? b[1] : '';
  }
  function fromRaw(d, src, i) {
    const ds = String(d.date || '');
    const month = /^\d{4}-\d{2}/.test(ds) ? ds.slice(0, 7) : new Date().toISOString().slice(0, 7);
    const day = /^\d{4}-\d{2}-\d{2}$/.test(ds) ? ds.slice(8) : null;
    return {
      id: d.id, src: src, seq: 1000 + i, date: month, day: day, key: month + '-' + (day || '01'),
      title: d.title || 'Sesión sin título', sub: d.sub || '', idea: d.idea || '',
      claves: Array.isArray(d.claves) ? d.claves : [], pensar: d.pensar || '',

      raw: d.text || '', blocks: textToBlocks(d.text || ''), added: d.added || '', hdr: d.hdr || ''
    };
  }
  function build() {
    const seed = E.map((e, i) => Object.assign({ seq: i, src: 'seed', key: e.date + '-00' }, e, LEARN[e.id] || {}));
    const added = NEW.map((d, i) => fromRaw(d, 'new', i)).concat((Array.isArray(sheetSess) ? sheetSess : []).map((d, i) => fromRaw(d, 'sheet', 500 + i)));
    items = seed.concat(added);
    items.forEach((e) => {
      if (e.gap) { e.hay = fold(e.title + ' ' + e.text); e.body = ''; return; }
      e.body = (e.blocks || []).map(flat).join(' ');
      e.hay = fold([e.title, e.sub || '', e.idea || '', (e.claves || []).join(' '), e.pensar || '', e.body].join(' '));
      e.mins = Math.max(1, Math.round(words(e.body) / 200));
      e.sw = words((e.idea || '') + ' ' + (e.claves || []).join(' '));
    });
    items.sort((a, b) => a.key < b.key ? -1 : a.key > b.key ? 1 : b.seq - a.seq);
    byId = {};
    items.forEach((e) => { byId[e.id] = e; });
    real = items.filter((e) => !e.gap);
  }
  const sumTime = (e) => e.sw <= 110 ? '30 s' : '1 min';

  function pool() {
    const out = CARDS.map((c, i) => ({ k: i, q: c.q, a: c.a, s: c.s }));
    real.forEach((e) => { if (e.idea) out.push({ k: 'i:' + e.id, q: '¿Cuál es la idea central de «' + e.title + '»?', a: e.idea, s: e.id }); });
    return out.filter((c) => byId[c.s]);
  }

  /* ---------- Piezas de HTML ---------- */
  function renderOl(list, q) {
    return '<ol>' + list.map((x) => Array.isArray(x)
      ? '<li>' + hl(x[0], q) + '<ul>' + x[1].map((s) => '<li>' + hl(s, q) + '</li>').join('') + '</ul></li>'
      : '<li>' + hl(x, q) + '</li>').join('') + '</ol>';
  }
  function renderOne(b, q) {
    switch (b[0]) {
      case 'p': return '<p>' + hl(b[1], q) + '</p>';
      case 'h': return '<h4>' + hl(b[1], q) + '</h4>';
      case 'ol': return renderOl(b[1], q);
      case 'call': return '<aside class="call"><b>' + hl(b[1], q) + '</b>' + (Array.isArray(b[2]) ? '<ol>' + b[2].map((s) => '<li>' + hl(s, q) + '</li>').join('') + '</ol>' : '<p>' + hl(b[2], q) + '</p>') + '</aside>';
      case 'q': return '<blockquote><p>' + hl(b[1], q) + '</p>' + (b[2] ? '<cite>' + hl(b[2], q) + '</cite>' : '') + '</blockquote>';
      case 'dl': return '<dl>' + b[1].map((x) => '<div><dt>' + hl(x[0], q) + '</dt><dd>' + hl(x[1], q) + '</dd></div>').join('') + '</dl>';
      case 'tags': return '<div class="tags"><span class="tl">' + hl(b[1], q) + '</span>' + b[2].map((t) => '<span class="tg">' + hl(t, q) + '</span>').join('') + '</div>';
      case 'links': return '<ul class="links">' + b[1].map((x) => {
        let host = ''; try { host = new URL(x[1]).hostname.replace(/^www\./, ''); } catch (e) {}
        return '<li><a href="' + esc(x[1]) + '" target="_blank" rel="noopener">' + esc(x[0]) + '</a><span class="u">' + esc(host) + '</span></li>';
      }).join('') + '</ul>';
    }
    return '';
  }
  function renderBlocks(bl, q) {
    let out = '', i = 0;
    while (i < bl.length) {
      if (bl[i][0] === 'li') {
        let li = '';
        while (i < bl.length && bl[i][0] === 'li') { li += '<li>' + hl(bl[i][1], q) + '</li>'; i++; }
        out += '<ul>' + li + '</ul>';
      } else { out += renderOne(bl[i], q); i++; }
    }
    return out;
  }
  function sesChips(ids) {
    return ids.filter((id) => byId[id]).map((id) => '<button type="button" class="chip s" data-open="' + id + '">' + esc(dateLabel(byId[id])) + '</button>').join('');
  }
  function termChips(ids) {
    return ids.filter((t) => glossById[t]).map((t) => '<button type="button" class="chip" data-term="' + t + '">' + esc(glossById[t].name) + '</button>').join('');
  }
  function snippet(e, q) {
    const fq = fold(q), ft = fold(e.body), i = ft.indexOf(fq);
    if (i < 0) return '';
    const a = Math.max(0, i - 50), b = Math.min(e.body.length, i + fq.length + 70);
    return (a > 0 ? '…' : '') + hl(e.body.slice(a, b), q) + (b < e.body.length ? '…' : '');
  }
  function isRecent(e) {
    if ((e.src !== 'new' && e.src !== 'sheet') || !e.added) return false;
    return Date.now() - new Date(e.added).getTime() < 21 * 864e5;
  }
  function row(e, q) {
    const p = parts(e.date), done = reviewed.has(e.id), m = my[e.id];
    const inHead = q && (fold(e.title + ' ' + (e.idea || '')).indexOf(fold(q)) !== -1);
    const sub = q && !inHead ? snippet(e, q) : esc(lead(e));
    return '<button type="button" class="row" data-open="' + e.id + '"><span class="d"><b>' + (e.day ? +e.day + ' ' : '') + AB[p.m] + '</b>' + p.y + '</span>' +
      '<span><span class="t">' + hl(e.title, q) + (isRecent(e) ? '<span class="new">Nueva</span>' : '') + '</span><span class="s">' + sub + '</span></span>' +
      '<span class="r">' + (done ? '<span class="tick" title="Repasada">✓</span>' : '') + (m && (m.note || m.comp) ? '<span class="dot" title="Tienes una nota"></span>' : '') + '</span></button>';
  }

  /* ---------- Calendario ---------- */
  function calendarHtml() {
    const status = {};
    items.forEach((e) => {
      if (e.gap) Object.keys(e.months).forEach((k) => { status[k] = { s: e.months[k], ids: [] }; });
      else { (status[e.date] = status[e.date] && status[e.date].s === 'ok' ? status[e.date] : { s: 'ok', ids: [] }).ids.push(e.id); }
    });
    const minY = parts(items[0].date).y, now = new Date(), maxY = Math.max(parts(items[items.length - 1].date).y, now.getFullYear());
    const nowKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    let h = '<div class="grid"><span></span>' + INI.map((c, i) => '<span class="mh" title="' + MES[i] + '">' + c + '</span>').join('');
    for (let y = minY; y <= maxY; y++) {
      h += '<span class="y">' + y + '</span>';
      for (let m = 0; m < 12; m++) {
        const key = y + '-' + String(m + 1).padStart(2, '0'), s = status[key], nm = MES[m] + ' ' + y, cur = key === nowKey ? ' now' : '';

  }
  const calBox = () => '<section class="calbox"><h3>Toca un mes para abrirlo</h3>' + calendarHtml() + '</section>';

  /* ---------- Vistas ---------- */
  const URL_PAC = 'https://proyectoamorconyugal.es/';

  function renderHome() {
    const last = real[real.length - 1];

        (S.homeShow ? '<p class="a">' + esc(c.a) + '</p><div class="chips2"><span>Ver en</span>' + sesChips([c.s]) + '</div>' : '<button type="button" class="btn" data-act="homeshow">Mostrar respuesta</button>') + '</div>';

  function matchItem(e) {
    const q = S.q.trim();
    if (q && e.hay.indexOf(fold(q)) === -1) return false;

  function renderChips() {

  function renderSessions() {

  }
  function renderResults() {

  function renderSession() {

    let h = '<div class="dbar"><button type="button" class="btn ghost" data-act="back">← Volver</button><div class="pg">' +
      (e.src === 'sheet' && connected() ? '<button type="button" class="btn" data-act="edit" data-id="' + e.id + '">Editar</button>' : '') +
      '<button type="button" class="btn" data-act="copy" data-id="' + e.id + '">Copiar</button></div></div>' +
      '<article class="sess"><div class="meta">' + esc(dateLabel(e)) + ' · Resumen ' + sumTime(e) + ' · Notas ' + e.mins + ' min' + '</div><h1>' + hl(e.title, q) + '</h1>' + (e.sub ? '<p class="sub">' + hl(e.sub, q) + '</p>' : '') +
      (e.idea ? '<div class="idea"><span class="lab">Idea central</span><p>' + hl(e.idea, q) + '</p></div>' : '') +
      ((e.claves || []).length ? '<span class="lab">Claves para recordar</span><ul class="claves">' + e.claves.map((x) => '<li>' + hl(x, q) + '</li>').join('') + '</ul>' : '') +
      (e.pensar ? '<div class="pensar"><span class="lab">Para pensar</span><p>' + hl(e.pensar, q) + '</p></div>' : '') +
      ((e.terms || []).length ? '<div class="terms"><span class="lab" style="margin:0">Conceptos</span>' + termChips(e.terms) + '</div>' : '') +
      '<details class="notes"' + (q ? ' open' : '') + '><summary>Notas completas · ' + e.mins + ' min</summary><div class="notes-body">' + (e.blocks.length ? renderBlocks(e.blocks, q) : '<p class="muted">Esta sesión no tiene notas completas.</p>') + '</div></details>' +
      '<div class="acts"><button type="button" class="btn' + (done ? ' done' : '') + '" data-rev="' + e.id + '">' + (done ? 'Repasada ✓' : 'Marcar como repasada') + '</button></div>' +
      '<section class="mine"><h3>Mi compromiso y mi nota</h3>' +
      '<label class="field">Mi compromiso<input type="text" id="my-comp" maxlength="160" placeholder="Algo concreto que voy a hacer" value="' + esc(m.comp || '') + '"></label>' +
      '<label class="check"><input type="checkbox" id="my-done"' + (m.done ? ' checked' : '') + '> Cumplido</label>' +
      '<label class="field">Mi nota<textarea id="my-note" rows="3" maxlength="1500" placeholder="Lo que me llevo, una duda…">' + esc(m.note || '') + '</textarea></label>' +
      '<div class="acts"><button type="button" class="btn" data-act="sharenote" data-id="' + e.id + '">Copiar para el grupo</button></div>' +

      '<div class="nextrow">' + (older ? '<button type="button" data-open="' + older.id + '">← Anterior<b>' + esc(older.title) + '</b></button>' : '<span></span>') + (newer ? '<button type="button" data-open="' + newer.id + '">Siguiente →<b>' + esc(newer.title) + '</b></button>' : '<span></span>') + '</div></article>';
    $('view').innerHTML = h;
  }

  /* ---------- Conceptos ---------- */
  function renderConcepts() {
    $('view').innerHTML = '<h2 class="sec" style="margin-top:.8rem">El hilo en 6 pasos</h2><ol class="steps">' +
      PATH.map((s) => '<li><details><summary><span><small>' + esc(s.ph) + '</small><b>' + esc(s.t) + '</b></span></summary><div class="in"><p>' + esc(s.x) + '</p><div class="chips2">' + termChips(s.terms) + '</div><div class="chips2"><span>Se explica en</span>' + sesChips(s.ses) + '</div></div></details></li>').join('') + '</ol>' +
      '<h2 class="sec">Conceptos</h2><div class="sbar" style="position:static;padding-top:0"><input type="search" id="cq" placeholder="Filtrar: pudor, sopor, alianza…" aria-label="Filtrar conceptos" autocomplete="off" value="' + esc(S.cq) + '"></div><div id="terms"></div>';
    renderTerms();
  }
  function renderTerms() {
    const fq = fold(S.cq.trim());
    const list = GLOSS.slice().sort((a, b) => fold(a.name).localeCompare(fold(b.name), 'es')).filter((g) => !fq || fold(g.name + ' ' + g.def).indexOf(fq) !== -1);
    $('terms').innerHTML = list.length ? list.map((g) => '<div class="tl"><details id="term-' + g.id + '"' + (fq && list.length === 1 ? ' open' : '') + '><summary><b>' + esc(g.name) + '</b></summary><div class="in"><p>' + esc(g.def) + '</p><div class="chips2"><span>Aparece en</span>' + sesChips(g.from) + '</div></div></details></div>').join('') : '<p class="empty">No hay conceptos con esa palabra.</p>';
  }

  /* ---------- Repasar ---------- */
  let deck = [], pos = 0, shown = false, onlyPending = false, cardPool = [];
  function buildDeck(shuffle) {
    cardPool = pool();
    let list = cardPool.filter((c) => !onlyPending || !known.has(c.k));
    if (shuffle) for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = list[i]; list[i] = list[j]; list[j] = t; }
    deck = list; pos = 0; shown = false;
  }
  function renderReview() {
    if (!deck.length && !pos) buildDeck(false);
    const n = cardPool.length, k = cardPool.filter((c) => known.has(c.k)).length;
    let h = '<div class="ctrls"><button type="button" class="btn" data-act="shuffle">Mezclar</button><label><input type="checkbox" id="pend"' + (onlyPending ? ' checked' : '') + '> Solo pendientes</label><button type="button" class="btn ghost" data-act="reset">Borrar progreso</button></div>' +
      '<div class="deckbar" style="margin-top:.9rem"><span>' + (pos < deck.length ? 'Tarjeta ' + (pos + 1) + ' de ' + deck.length : 'Fin de la vuelta') + '</span><span>' + k + ' de ' + n + ' sabidas</span></div><div class="bar2" style="margin-top:.4rem"><i style="width:' + Math.round(100 * k / Math.max(1, n)) + '%"></i></div>';
    if (pos >= deck.length) {
      h += '<div class="card"><span class="lab">Vuelta completada</span><div class="q">' + (deck.length ? 'Has repasado ' + deck.length + ' tarjetas.' : (onlyPending ? 'No te queda ninguna pendiente.' : 'No hay tarjetas.')) + '</div><div class="a">Sabes ' + k + ' de ' + n + '.</div><div class="acts">' + (k < n ? '<button type="button" class="btn primary" data-act="pending">Repasar pendientes</button>' : '') + '<button type="button" class="btn" data-act="restart">Empezar de nuevo</button></div></div>';
    } else {
      const c = deck[pos];
      h += '<div class="card"><span class="lab">Pregunta</span><div class="q">' + esc(c.q) + '</div>' + (shown
        ? '<div class="a">' + esc(c.a) + '</div><div class="src"><span>Ver en</span>' + sesChips([c.s]) + '</div><div class="acts"><button type="button" class="btn primary" data-act="know">La sabía</button><button type="button" class="btn" data-act="again">Repasar otra vez</button></div>'
        : '<div class="acts"><button type="button" class="btn primary" data-act="show">Mostrar respuesta</button></div>') + '</div>' +
        '<div class="subnav"><button type="button" class="btn ghost" data-act="prev"' + (pos === 0 ? ' disabled' : '') + '>← Anterior</button><button type="button" class="btn ghost" data-act="skip">Saltar →</button></div>';
    }
    $('view').innerHTML = h;
  }
  function deckAct(a) {
    const c = deck[pos];
    if (a === 'show') shown = true;
    else if (a === 'know') { known.add(c.k); LS.set('pac.known', Array.from(known)); pos++; shown = false; }
    else if (a === 'again') { known.delete(c.k); LS.set('pac.known', Array.from(known)); pos++; shown = false; }
    else if (a === 'skip') { pos++; shown = false; }
    else if (a === 'prev') { if (pos > 0) pos--; shown = false; }
    else if (a === 'pending') { onlyPending = true; buildDeck(false); }
    else if (a === 'restart') { buildDeck(false); }
    else if (a === 'shuffle') { buildDeck(true); }
    else if (a === 'reset') { known.clear(); LS.set('pac.known', []); onlyPending = false; buildDeck(false); }
    renderReview();
  }

  /* ---------- Hoja y avisos ---------- */

      '<div class="acts"><button type="button" class="btn primary" data-act="close">Entendido</button></div>');
  }
  let toastT;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function openTerm(id) {

    const list = real.filter((e) => e.date.slice(0, 4) === String(y));

    list.forEach((e) => (e.terms || []).forEach((t) => { count[t] = (count[t] || 0) + 1; }));
    const top = Object.keys(count).sort((a, b) => count[b] - count[a]).slice(0, 6);
    openSheet('<h2>Repaso de ' + y + '</h2><p class="hint">' + list.length + ' sesiones. Una frase por sesión.</p>' +
      list.map((e) => '<button type="button" class="row" data-open="' + e.id + '"><span class="d"><b>' + AB[parts(e.date).m] + '</b></span><span><span class="t">' + esc(e.title) + '</span><span class="s" style="-webkit-line-clamp:3">' + esc(lead(e)) + '</span></span><span></span></button>').join('') +
      (top.length ? '<h2 class="sec">Conceptos más tratados</h2><div class="chips2">' + termChips(top) + '</div>' : '') +
      '<div class="acts" style="margin-top:1rem"><button type="button" class="btn" data-act="close">Cerrar</button></div>');
  }
  function summaryText(e) {
    let t = e.title + ' (' + dateLabel(e) + ')\n';
    if (e.idea) t += '\nIdea central: ' + e.idea + '\n';
    if ((e.claves || []).length) t += '\nClaves:\n' + e.claves.map((x) => '- ' + x).join('\n') + '\n';
    if (e.pensar) t += '\nPara pensar: ' + e.pensar + '\n';
    return t.trim();
  }
  function copyRaw(txt, title) {
    const fallback = () => {
      openSheet('<h2>' + esc(title || 'Copiar') + '</h2><p class="hint">Mantén pulsado el texto, selecciónalo y cópialo.</p><textarea class="copy" id="copy-t" readonly></textarea><div class="acts" style="margin-top:.7rem"><button type="button" class="btn" data-act="close">Cerrar</button></div>');
      const ta = $('copy-t'); ta.value = txt; ta.focus(); ta.select();
    };
    try {
      if (!navigator.clipboard) return fallback();
      navigator.clipboard.writeText(txt).then(() => toast('Copiado.'), fallback);
    } catch (err) { fallback(); }
  }

  /* ---------- Sesiones nuevas: hoja de Google ---------- */
  const apiUrl = () => String(window.PAC_URL || LS.get('pac.url', '') || '').trim();
  const apiKey = () => String(LS.get('pac.key', '') || '');
  const connected = () => !!(apiUrl() && apiKey());
  async function apiCall(req) {
    const r = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: apiKey() }, req)) });
    const j = await r.json();
    if (!j || !j.ok) throw { code: (j && j.error) || 'error' };
    return j;
  }
  const apiMsg = (e) => e && e.code === 'clave' ? 'La clave no es correcta.' : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
  async function loadNotas() {
    const url = apiUrl(); if (!url) return;
    try {
      const r = await fetch(url + (url.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
      const j = await r.json();
      if (j && Array.isArray(j.sessions)) { sheetSess = j.sessions; LS.set('pac.cache', sheetSess); refresh(); }
    } catch (e) {}
  }

  const DRAFT = 'pac.draft';
  let editId = null, pickTerms = new Set(), saving = false;
  function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function readForm() {
    return {
      date: $('e-date').value || todayStr(), title: $('e-title').value.trim(), text: $('e-text').value.trim(), idea: $('e-idea').value.trim(),
      claves: $('e-claves').value, pensar: $('e-pensar').value.trim(), terms: Array.from(pickTerms)
    };
  }
  function openEditor(id) {
    const cur = id ? byId[id] : null;
    editId = cur ? cur.id : null;
    const dr = !cur ? LS.get(DRAFT, null) : null;
    const v = cur ? { date: cur.date + '-' + (cur.day || '01'), title: cur.title, text: cur.raw, idea: cur.idea, claves: (cur.claves || []).join('\n'), pensar: cur.pensar, terms: cur.terms || [] }
      : (dr || { date: todayStr(), title: '', text: '', idea: '', claves: '', pensar: '', terms: [] });
    pickTerms = new Set(v.terms || []);
    openSheet('<h2>' + (cur ? 'Editar sesión' : 'Nueva sesión') + '</h2>' +
      '<p class="hint">' + (dr && (dr.title || dr.text) ? 'Hemos recuperado tu borrador. ' : '') + (cur ? '' : 'Mientras escribes se guarda un borrador en este móvil. ') + 'Pulsa Guardar para publicarla en la web.</p>' +
      '<label class="field">Fecha de la catequesis<input type="date" id="e-date" value="' + esc(v.date) + '"></label>' +
      '<label class="field">Título<input type="text" id="e-title" maxlength="120" placeholder="Ej.: El pudor y la mirada" value="' + esc(v.title) + '"></label>' +
      '<label class="field">Tus notas<textarea id="e-text" rows="9" placeholder="Pega o escribe aquí tus notas. Las líneas que empiezan por «.» o «-» se muestran como viñetas.">' + esc(v.text) + '</textarea></label>' +
      '<details class="notes"><summary>Añadir resumen (opcional)</summary><div class="notes-body">' +
      '<label class="field">Idea central (una frase)<textarea id="e-idea" rows="2" maxlength="300">' + esc(v.idea) + '</textarea></label>' +
      '<label class="field">Claves (una por línea)<textarea id="e-claves" rows="3">' + esc(v.claves) + '</textarea></label>' +
      '<label class="field">Para pensar<input type="text" id="e-pensar" maxlength="240" value="' + esc(v.pensar) + '"></label>' +
      '<span class="lab">Conceptos relacionados</span><div class="terms" id="e-terms">' + GLOSS.map((g) => '<button type="button" class="chip pick" data-pick="' + g.id + '" aria-pressed="' + pickTerms.has(g.id) + '">' + esc(g.name.replace(/ y donación| originaria| y naturaleza caída/g, '')) + '</button>').join('') + '</div></div></details>' +
      '<div class="acts" style="margin-top:1rem"><button type="button" class="btn primary" id="e-save" data-act="save">Guardar</button><button type="button" class="btn" data-act="close">Cerrar</button>' + (cur ? '<button type="button" class="btn danger" data-act="delask">Borrar</button>' : '') + '</div>' +
      '<p class="hint" style="margin-top:.8rem"><button type="button" class="linkbtn" data-act="goff">Olvidar la clave en este móvil</button></p>');
  }
  async function saveSession() {
    if (saving) return;
    const f = readForm();
    if (!f.title && !f.text) { toast('Añade al menos un título o tus notas.'); return; }
    const old = editId ? sheetSess.find((x) => x.id === editId) : null;
    const doc = {
      id: editId || 's' + Date.now().toString(36), date: f.date, title: f.title || f.text.split(/\r?\n/)[0].slice(0, 80), idea: f.idea,
      claves: f.claves.split('\n').map((x) => x.trim()).filter(Boolean), pensar: f.pensar, terms: f.terms, text: f.text,
      added: old ? old.added || todayStr() : todayStr()
    };
    saving = true;
    const btn = $('e-save'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
    try {
      await apiCall({ op: 'save', session: doc });
      sheetSess = sheetSess.filter((x) => x.id !== doc.id).concat([doc]); LS.set('pac.cache', sheetSess);
      if (!editId) LS.set(DRAFT, null);
      closeSheet(); refresh(); toast('Guardada. Ya la ven todos.'); loadNotas();
    } catch (e) {
      toast(apiMsg(e));
      if (e && e.code === 'clave') { LS.set('pac.key', ''); closeSheet(); openConnect(); }
      else if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; }
    }
    saving = false;
  }
  async function delSession() {
    if (saving || !editId) return;
    saving = true;
    try {
      await apiCall({ op: 'delete', id: editId });
      sheetSess = sheetSess.filter((x) => x.id !== editId); LS.set('pac.cache', sheetSess);
      closeSheet(); refresh(); toast('Sesión borrada.');
    } catch (e) { toast(apiMsg(e)); }
    saving = false;
  }
  function openConnect() {
    openSheet('<h2>Escribir en la web</h2><p class="hint">Escribe la clave de edición que pusiste al crear la hoja de Google. Solo hace falta una vez en cada móvil.</p>' +
      (window.PAC_URL ? '' : '<label class="field">Dirección de la hoja (termina en /exec)<input type="text" id="g-url" autocomplete="off" autocapitalize="none" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(LS.get('pac.url', '')) + '"></label>') +
      '<label class="field">Clave de edición<input type="password" id="g-key" autocomplete="off"></label>' +
      '<div class="acts" style="margin-top:1rem"><button type="button" class="btn primary" data-act="gsave">Continuar</button><button type="button" class="btn" data-act="close">Cerrar</button></div>');
  }
  async function saveCfg() {
    const urlIn = $('g-url') ? $('g-url').value.trim() : '', key = $('g-key').value;
    if ($('g-url')) {
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(urlIn)) { toast('La dirección debe terminar en /exec.'); return; }
      LS.set('pac.url', urlIn);
    }
    if (!key) { toast('Escribe la clave.'); return; }
    LS.set('pac.key', key);
    try { await apiCall({ op: 'ping' }); closeSheet(); render(); toast('Listo. Ya puedes escribir.'); loadNotas(); openEditor(null); }
    catch (e) { LS.set('pac.key', ''); toast(e && e.code === 'clave' ? 'La clave no es correcta.' : 'No se pudo conectar con la hoja. Revisa la dirección.'); }
  }
  function disconnect() { LS.set('pac.key', ''); closeSheet(); render(); toast('Clave olvidada en este móvil.'); }

  /* ---------- Mis datos: copia de seguridad ---------- */
  function openData() {
    const dump = JSON.stringify({ v: 1, reviewed: Array.from(reviewed), known: Array.from(known), my: my });
    openSheet('<h2>Mis datos</h2><p class="hint">Lo que repasas, tus notas y compromisos se guardan solo en este dispositivo. Para pasarlos a otro móvil o guardarlos, copia este código y pégalo allí.</p>' +
      '<div class="acts"><button type="button" class="btn primary" data-act="copydata">Copiar mis datos</button></div>' +
      '<label class="field" style="margin-top:1rem">Pegar datos de otro dispositivo<textarea id="imp" rows="3" placeholder="Pega aquí el código copiado"></textarea></label>' +
      '<div class="acts"><button type="button" class="btn" data-act="import">Importar</button><button type="button" class="btn" data-act="close">Cerrar</button></div>' +
      '');

  }
  function importData() {
    const t = ($('imp').value || '').trim();
    try {
      const d = JSON.parse(t);
      if (!d || d.v !== 1) throw new Error('x');
      (d.reviewed || []).forEach((x) => reviewed.add(x));
      (d.known || []).forEach((x) => known.add(x));
      Object.keys(d.my || {}).forEach((k) => { my[k] = Object.assign({}, d.my[k], my[k] || {}); });
      LS.set('pac.reviewed', Array.from(reviewed)); LS.set('pac.known', Array.from(known)); saveMy();
      closeSheet(); buildDeck(false); refresh(); toast('Datos importados.');
    } catch (e) { toast('Ese código no es válido.'); }
  }

  /* ---------- Navegación ---------- */
  const TABS = ['inicio', 'sesiones', 'conceptos', 'repasar'];
  function render() {
    renderTop();
    document.querySelectorAll('.bar [data-tab]').forEach((b) => { if (b.dataset.tab === (S.sid ? S.from : S.tab)) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (S.sid) renderSession();
    else if (S.tab === 'inicio') renderHome();
    else if (S.tab === 'sesiones') renderSessions();
    else if (S.tab === 'conceptos') renderConcepts();
    else renderReview();
  }
  function setHash(h) { try { if (location.hash !== '#' + h) location.hash = h; } catch (e) {} }
  function go(tab, sid) {
    S.scroll[S.sid ? 's' : S.tab] = window.scrollY;
    if (sid) { if (!S.sid) S.from = S.tab; S.sid = sid; setHash('s-' + sid); }
    else { S.tab = tab; S.sid = null; setHash(tab); }
    render();
    window.scrollTo(0, sid ? 0 : (S.scroll[tab] || 0));
  }
  function route() {
    const h = (location.hash || '').slice(1);
    if (!h) return;
    if (h.indexOf('s-') === 0) { const id = h.slice(2); if (byId[id] && S.sid !== id) { if (!S.sid) S.from = S.tab; S.sid = id; render(); window.scrollTo(0, 0); } }
    else if (TABS.indexOf(h) !== -1 && (S.tab !== h || S.sid)) { S.tab = h; S.sid = null; render(); }
  }
  function refresh() {
    build();
    if (S.sid && document.activeElement && /^my-/.test(document.activeElement.id)) return;
    if (S.sid && !byId[S.sid]) { S.sid = null; S.tab = 'sesiones'; }
    render();
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', (ev) => {
    const t = ev.target;
    const o = t.closest('[data-open]');
    if (o) { closeSheet(); go(null, o.dataset.open); return; }
    const mo = t.closest('[data-month]');
    if (mo) { S.month = mo.dataset.month; S.q = ''; S.filter = 'todas'; closeSheet(); go('sesiones'); return; }
    const tb = t.closest('[data-tab]');
    if (tb) { closeSheet(); go(tb.dataset.tab); return; }
    const tm = t.closest('[data-term]');
    if (tm) { openTerm(tm.dataset.term); return; }
    const f = t.closest('[data-f]');
    if (f) { S.filter = f.dataset.f; renderChips(); renderResults(); return; }
    const pk = t.closest('[data-pick]');
    if (pk) { const id = pk.dataset.pick; if (pickTerms.has(id)) pickTerms.delete(id); else pickTerms.add(id); pk.setAttribute('aria-pressed', pickTerms.has(id)); if (!editId) LS.set(DRAFT, readForm()); return; }
    const rv = t.closest('[data-rev]');
    if (rv) { const id = rv.dataset.rev; if (reviewed.has(id)) reviewed.delete(id); else reviewed.add(id); LS.set('pac.reviewed', Array.from(reviewed)); const on = reviewed.has(id); rv.textContent = on ? 'Repasada ✓' : 'Marcar como repasada'; rv.classList.toggle('done', on); return; }
    if (t.closest('[data-close]')) { closeSheet(); return; }
    const a = t.closest('[data-act]');
    if (!a) return;
    const act = a.dataset.act, id = a.dataset.id;
    if (act === 'back') go(S.from || 'sesiones');
    else if (act === 'close') closeSheet();
    else if (act === 'copy') { const e = byId[id]; if (e) copyRaw(summaryText(e), 'Copiar resumen'); }
    else if (act === 'sharenote') { const e = byId[id], m = my[id] || {}; if (e) copyRaw('Sobre «' + e.title + '» (' + dateLabel(e) + ')' + (m.note ? '\n' + m.note : '') + (m.comp ? '\nMi compromiso: ' + m.comp : ''), 'Copiar para el grupo'); }
    else if (act === 'homeshow') { S.homeShow = true; renderHome(); }
    else if (act === 'compdone') { my[id] = Object.assign({}, my[id], { done: true }); saveMy(); renderHome(); toast('Compromiso cumplido.'); }
    else if (act === 'clearmonth') { S.month = null; renderChips(); renderResults(); }
    else if (act === 'year') openYear(a.dataset.y);
    else if (act === 'new') openEditor(null);
    else if (act === 'edit') openEditor(id);
    else if (act === 'save') saveSession();
    else if (act === 'delask') { a.dataset.act = 'del'; a.textContent = '¿Seguro? Borrar'; }
    else if (act === 'del') delSession();
    else if (act === 'write') { if (connected()) openEditor(null); else openConnect(); }
    else if (act === 'gsave') saveCfg();
    else if (act === 'goff') disconnect();
    else if (act === 'copydata') copyRaw(S.dump || '', 'Copiar mis datos');
    else if (act === 'import') importData();
    else if (act === 'mydata') openData();
    else if (act === 'tour') openTour();
    else deckAct(act);
  });
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'q') { S.q = t.value; renderResults(); }
    else if (t.id === 'cq') { S.cq = t.value; renderTerms(); }
    else if (t.id && t.id.indexOf('e-') === 0 && !editId && $('e-title')) LS.set(DRAFT, readForm());
    else if (t.id === 'my-comp' || t.id === 'my-note') {
      const cur = my[S.sid] || {};
      cur[t.id === 'my-comp' ? 'comp' : 'note'] = t.value; my[S.sid] = cur; saveMy();
    }
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'e-date' && !editId && $('e-title')) { LS.set(DRAFT, readForm()); return; }
    if (t.id === 'pend') { onlyPending = t.checked; buildDeck(false); renderReview(); }
    else if (t.id === 'my-done') { my[S.sid] = Object.assign({}, my[S.sid], { done: t.checked }); saveMy(); }
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
  window.addEventListener('hashchange', route);

  /* ---------- Arranque ---------- */
  build();
  buildDeck(false);
  $('foot').innerHTML = '<a href="' + URL_EV + '" target="_blank" rel="noopener">Evangelio del día</a> · <a href="' + URL_PAC + '" target="_blank" rel="noopener">Proyecto Amor Conyugal</a><br>Las ideas centrales, las claves y las tarjetas resumen las notas de cada sesión. <button type="button" class="linkbtn" data-act="tour">Cómo funciona</button> · <button type="button" class="linkbtn" data-act="mydata">Mis datos</button>';
  render();
  route();
  if (!LS.get('pac.tour', 0)) openTour();
  loadNotas();
})();

</script>
</body>
</html>
